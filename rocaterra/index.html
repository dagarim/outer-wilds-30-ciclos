0px);position:relative}.planet{position:absolute;right:4%;left:auto;top:4%;width:48%;height:86%;display:flex;align-items:center;justify-content:center;overflow:visible}.rocaterra-sphere{position:relative;width:min(34vw,340px);height:min(34vw,340px);border-radius:46% 54% 49% 51% / 52% 45% 55% 48%;background:radial-gradient(circle at 29% 24%,#f4f6f6 0,#d4d8d9 16%,#a5abad 38%,#777f82 61%,#444b4e 82%,#252a2d 100%);box-shadow:inset -34px -25px 48px #090d10aa,inset 15px 12px 28px #ffffff55,0 0 35px #dbe2e555,0 0 90px #aeb9bf33;overflow:hidden;transform:rotate(-4deg);animation:planetPulse 7s ease-in-out infinite}.rocaterra-sphere:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 30% 24%,#ffffff66 0 9%,transparent 30%),radial-gradient(ellipse at 72% 70%,#090d10aa 0 16%,transparent 48%),linear-gradient(125deg,transparent 38%,#05080b99 100%);mix-blend-mode:soft-light}.forest-crater{position:absolute;z-index:3;left:18%;bottom:17%;width:27%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,#20272a 0 28%,#555d5f 29% 48%,#252b2e 49% 68%,#111619 69%);transform:rotate(-12deg);box-shadow:inset 0 5px 8px #050708aa,0 2px 4px #ffffff18}.forest-crater span,.forest-crater i,.forest-crater b{position:absolute;display:block;bottom:28%;width:5px;height:14px;border-radius:50% 50% 20% 20%;background:linear-gradient(90deg,#1b3026,#657568 55%,#26372c);transform-origin:bottom center}.forest-crater span{left:31%;height:18px;transform:rotate(-8deg)}.forest-crater i{left:49%;height:13px;transform:rotate(9deg)}.forest-crater b{left:65%;height:16px;transform:rotate(4deg)}.simple-crater{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 38% 34%,#f2f4f455 0 7%,#777f8244 22%,#171c1f99 58%,#080c0fbb 78%,transparent 100%);box-shadow:inset 5px 6px 10px #05080a99,inset -3px -3px 6px #e9edef22;opacity:.82;z-index:2}.simple-crater.c1{width:58px;height:34px;left:12%;top:31%;transform:rotate(-18deg)}.simple-crater.c2{width:42px;height:28px;right:15%;top:19%;transform:rotate(15deg)}.simple-crater.c3{width:67px;height:39px;right:18%;bottom:18%;transform:rotate(-8deg)}.simple-crater.c4{width:31px;height:21px;left:39%;bottom:11%;transform:rotate(20deg)}.simple-crater.c5{width:48px;height:27px;left:27%;top:13%;transform:rotate(8deg)}.simple-crater.c6{width:35px;height:22px;left:65%;top:42%;transform:rotate(-22deg)}.simple-crater.c7{width:60px;height:31px;left:9%;bottom:24%;transform:rotate(12deg)}.simple-crater.c8{width:38px;height:23px;right:9%;bottom:39%;transform:rotate(-14deg)}.rocaterra-sphere:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 25%,#fff4 0 8%,transparent 28%),linear-gradient(120deg,transparent 38%,#05080baa 100%);mix-blend-mode:multiply}.signal{font:10px monospace;letter-spacing:3px;color:#aab5bb;margin-bottom:7px;display:flex;align-items:center;gap:9px;height:14px}.signal-real{display:none}.signal.decoded .decode-scan,.signal.decoded .decode-label{display:none}.signal.decoded .signal-real{display:inline}.signal-real{color:#aab5bb}.signal-real b{color:#fff;font-weight:bold}.decode-scan{display:inline-flex;gap:3px;height:12px;align-items:flex-end}.decode-scan i{display:block;width:2px;height:5px;background:#cbd4d8;opacity:.35;animation:decodeBars .9s ease-in-out infinite}.decode-scan i:nth-child(2){animation-delay:.12s}.decode-scan i:nth-child(3){animation-delay:.24s}.decode-scan i:nth-child(4){animation-delay:.36s}@keyframes decodeBars{0%,100%{height:4px;opacity:.25}50%{height:12px;opacity:.9}}.signal b{color:#d5dde1}.title{font-size:22px;letter-spacing:4px;font-weight:normal;margin:0 0 5px;color:#edf0f1}.subtitle{font:9px monospace;letter-spacing:1.5px;color:#89949a;margin-bottom:7px}.message{min-height:100px;display:flex;align-items:flex-start}.message blockquote{margin:0;padding-left:16px;border-left:2px solid #aeb9be;font:16px/1.5 "Space Mono",monospace;color:#dce1e3}.quote-text{white-space:pre-line}.keyword{color:#fff;font-weight:bold;text-shadow:0 0 9px #d8e0e244}.bold-only{font-weight:bold}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;position:absolute;left:20px;right:35px;bottom:8px}.button{border:1px solid #68757b;background:#0d1114;color:#cbd4d8;padding:10px 15px;font:10px monospace;letter-spacing:2px;cursor:pointer}.button.ready{border-color:#d5dde1;background:#252d31;color:#fff;box-shadow:0 0 16px #d7e0e133;animation:buttonReady 1.4s ease-in-out infinite}@keyframes buttonReady{50%{box-shadow:0 0 24px #d7e0e166}}.dots{font:9px monospace;letter-spacing:4px;color:#758087}.gift{margin-top:4px;border:1px solid #58636a;padding:9px;background:#0d1112aa;box-shadow:inset 0 0 25px #d7e0e30a;font:9px monospace;letter-spacing:1px;color:#bfc8cc}.gift b{color:#dfe5e7}.final{margin-top:10px;padding-left:12px;border-left:2px solid #aeb9be;font:14px/1.5 "Space Mono",monospace;color:#e5e9ea;min-height:45px}@keyframes planetPulse{50%{transform:scale(1.015)}}@media(prefers-reduced-motion:reduce){.rocaterra-sphere{animation:none}}@media(orientation:portrait){main{display:none}.rotate{display:flex}}@media(orientation:landscape) and (max-height:900px){main{height:100dvh;min-height:100dvh}.panel{height:calc(100dvh - 12px);min-height:0;padding:12px 20px}.panel:before{display:none}.hero{min-height:0;height:calc(100dvh - 58px);grid-template-columns:30% 70%;overflow:hidden}.rocaterra-sphere{width:175px;height:175px}.data{position:absolute;left:3%;right:auto;top:7%;width:53%;height:82%;padding:12px 18px 36px;border-left:1px solid #495258;background:linear-gradient(90deg,#080b0e00,#080b0e66 18%,#080b0eaa)}.title{font-size:18px;letter-spacing:3px}.message{min-height:55px;align-items:flex-start;padding-top:4px}.message blockquote{font-size:13px;line-height:1.35;overflow-wrap:anywhere}.gift{margin-top:4px;padding:5px;font-size:7.5px}.final{font-size:13px;min-height:42px;margin-top:6px}.nav{margin-top:3px;bottom:3px;left:14px;right:14px}.button{padding:5px 7px;font-size:6.5px}.crater{transform:scale(.75)}}</style></head><body><div class="rotate"><div>GIRA TU TRADUCTOR NOMAI<small>ORIENTACIÓN HORIZONTAL REQUERIDA</small></div></div><main><section class="panel"><div class="top"><span class="meta">EXPLORER · 30 CICLOS DE EXPLORACIÓN</span><span class="meta identity">SEÑAL 02 · ROCATERRA</span></div>
<div class="screen active" id="s1"><div class="hero"><div class="planet"><div class="rocaterra-sphere"><div class="forest-crater"><span></span><i></i><b></b></div><i class="simple-crater c1"></i><i class="simple-crater c2"></i><i class="simple-crater c3"></i><i class="simple-crater c4"></i><i class="simple-crater c5"></i><i class="simple-crater c6"></i><i class="simple-crater c7"></i><i class="simple-crater c8"></i></div></div><div class="data"><div class="signal decoding"><span class="decode-scan"><i></i><i></i><i></i><i></i></span><span class="decode-label">DESCIFRANDO</span><span class="signal-real">TRANSMISIÓN NOMAI DETECTADA · <b>ESKER</b></span></div><h1 class="title">ROCATERRA</h1><div class="subtitle">REGISTRO DE EXPLORACIÓN</div><div class="message"><blockquote><span class="quote-text"></span></blockquote></div><div class="nav"><span class="dots">● ○</span><button class="button" onclick="go(2)">SIGUIENTE →</button></div></div></div></div>
<div class="screen" id="s2"><div class="hero"><div class="planet"><div class="rocaterra-sphere"><div class="forest-crater"><span></span><i></i><b></b></div><i class="simple-crater c1"></i><i class="simple-crater c2"></i><i class="simple-crater c3"></i><i class="simple-crater c4"></i><i class="simple-crater c5"></i><i class="simple-crater c6"></i><i class="simple-crater c7"></i><i class="simple-crater c8"></i></div></div><div class="data"><div class="signal"><span class="signal-real" style="display:inline">TRANSMISIÓN NOMAI · <b>ESKER</b></span></div><h1 class="title">SEÑAL EN CURSO</h1><div class="subtitle">REGISTRO · PROYECTO ACTUAL</div><div class="message"><blockquote><span class="quote-text"></span></blockquote></div><div class="nav"><button class="button" onclick="go(1)">← ANTERIOR</button><span class="dots">○ ●</span><button class="button" onclick="go(1)">VOLVER AL INICIO ↺</button></div></div></div></div></section></main><script>
let typing,decodeTimer;
const lines={
  1:[['Hay curiosidades que no necesitan un objetivo claro, a veces solo hay que <span class="keyword">confiar</span> en la señal.',false]],
  2:[['No parece que el explorador sepa exactamente qué está buscando.',false],['Eso nunca ha sido un problema.',false]]
};
function typeMsg(n){
  clearInterval(typing);
  const els=document.querySelectorAll('#s'+n+' .quote-text');
  const el=els[0];
  if(!el)return;
  el.innerHTML='';
  let li=0,ci=0;
  const arr=lines[n]||[];
  typing=setInterval(()=>{
    if(li>=arr.length){clearInterval(typing);screenReady(n);return}
    if(!el.children[li]){
      const p=document.createElement('p');
      p.className=arr[li][1]?'bold-only':'';
      el.appendChild(p);
    }
    const p=el.children[li],text=arr[li][0];
    const prefix='<b style="color:#fff">ESKER:</b> ';
    if(ci<text.length){p.innerHTML=prefix+text.slice(0,++ci)}
    else{li++;ci=0}
  },28);
}
function screenReady(n){
  const screen=document.getElementById('s'+n);
  screen.querySelectorAll('.button').forEach(b=>b.classList.add('ready'));
}
function go(n){
  clearInterval(typing);clearTimeout(decodeTimer);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const screen=document.getElementById('s'+n);
  screen.classList.add('active');
  const signal=screen.querySelector('.signal');
  const msg=screen.querySelector('.quote-text');
  screen.querySelectorAll('.button').forEach(b=>b.classList.remove('ready'));
  if(msg)msg.innerHTML='';
  if(n===1){
    signal.classList.remove('decoded');
    signal.classList.add('decoding');
    let dots=0;
    const decoder=setInterval(()=>{
      dots=(dots+1)%4;
      const d=signal.querySelector('.decode-inline');
      if(d)d.textContent='DESCIFRANDO SEÑAL'+'.'.repeat(dots);
    },450);
    decodeTimer=setTimeout(()=>{
      clearInterval(decoder);
      signal.classList.remove('decoding');
      signal.classList.add('decoded');
      typeMsg(n);
    },5000);
  }else{
    signal.classList.add('decoded');
    typeMsg(n);
  }
}
window.addEventListener('load',()=>setTimeout(()=>go(1),250));
window.addEventListener('orientationchange',()=>setTimeout(()=>{if(matchMedia('(orientation:landscape)').matches)go(1)},180));
</script></body></html>
