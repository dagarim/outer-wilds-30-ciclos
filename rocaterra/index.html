<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rocaterra · La Curiosidad · 30 Ciclos</title><style>

0px);position:relative}.planet{position:absolute;right:4%;left:auto;top:4%;width:48%;height:86%;display:flex;align-items:center;justify-content:center;overflow:visible}.rocaterra-sphere{position:relative;width:min(34vw,340px);height:min(34vw,340px);border-radius:50%;background:radial-gradient(circle at 29% 24%,#f4f6f6 0,#d4d8d9 16%,#a5abad 38%,#777f82 61%,#444b4e 82%,#252a2d 100%);box-shadow:inset -34px -25px 48px #090d10aa,inset 15px 12px 28px #ffffff55,0 0 35px #dbe2e555,0 0 90px #aeb9bf33;overflow:hidden;animation:planetPulse 7s ease-in-out infinite}.rocaterra-sphere:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,transparent 0 7%,#59616655 7.3% 10%,transparent 10.5%),radial-gradient(circle at 62% 18%,transparent 0 5%,#4c555a55 5.4% 8%,transparent 8.5%),radial-gradient(circle at 78% 37%,transparent 0 10%,#4d565b66 10.4% 14%,transparent 14.5%),radial-gradient(circle at 38% 43%,transparent 0 4%,#414a4f66 4.5% 7%,transparent 7.5%),radial-gradient(circle at 65% 56%,transparent 0 7%,#4a535866 7.4% 11%,transparent 11.5%),radial-gradient(circle at 24% 68%,transparent 0 9%,#535c6166 9.4% 13%,transparent 13.5%),radial-gradient(circle at 52% 78%,transparent 0 5%,#3e474c55 5.5% 9%,transparent 9.5%),radial-gradient(circle at 82% 78%,transparent 0 6%,#515a5f66 6.4% 10%,transparent 10.5%)}.forest-crater{position:absolute;z-index:3;left:18%;bottom:17%;width:27%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,#20272a 0 28%,#555d5f 29% 48%,#252b2e 49% 68%,#111619 69%);transform:rotate(-12deg);box-shadow:inset 0 5px 8px #050708aa,0 2px 4px #ffffff18}.forest-crater span,.forest-crater i,.forest-crater b{position:absolute;display:block;bottom:28%;width:5px;height:14px;border-radius:50% 50% 20% 20%;background:linear-gradient(90deg,#1b3026,#657568 55%,#26372c);transform-origin:bottom center}.forest-crater span{left:31%;height:18px;transform:rotate(-8deg)}.forest-crater i{left:49%;height:13px;transform:rotate(9deg)}.forest-crater b{left:65%;height:16px;transform:rotate(4deg)}.rocaterra-sphere:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 25%,#fff4 0 8%,transparent 28%),linear-gradient(120deg,transparent 38%,#05080baa 100%);mix-blend-mode:multiply}.crater{position:absolute;border-radius:50%;border:2px solid #d9dfe155;box-shadow:inset 4px 4px 8px #151a1d88,inset -3px -3px 6px #e9edef55;opacity:.85}.crater.c1{width:42px;height:26px;left:17%;top:39%;transform:rotate(-18deg)}.crater.c2{width:28px;height:18px;right:17%;top:20%;transform:rotate(12deg)}.crater.c3{width:50px;height:31px;right:24%;bottom:19%;transform:rotate(-8deg)}.crater.c4{width:20px;height:13px;left:43%;bottom:12%;transform:rotate(22deg)}.signal{font:10px monospace;letter-spacing:3px;color:#aab5bb;margin-bottom:7px}.signal-real{display:none}.decode-inline{animation:decodePulse 1s ease-in-out infinite}@keyframes decodePulse{50%{opacity:.35}}.signal b{color:#d5dde1}.title{font-size:22px;letter-spacing:4px;font-weight:normal;margin:0 0 5px;color:#edf0f1}.subtitle{font:9px monospace;letter-spacing:1.5px;color:#89949a;margin-bottom:7px}.message{min-height:100px;display:flex;align-items:flex-start}.message blockquote{margin:0;padding-left:16px;border-left:2px solid #aeb9be;font:16px/1.5 "Space Mono",monospace;color:#dce1e3}.quote-text{white-space:pre-line}.keyword{color:#d7dfe2;font-weight:bold;text-shadow:0 0 9px #d8e0e244}.bold-only{font-weight:bold}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;position:absolute;left:20px;right:35px;bottom:8px}.button{border:1px solid #68757b;background:#0d1114;color:#cbd4d8;padding:10px 15px;font:10px monospace;letter-spacing:2px;cursor:pointer}.button.ready{border-color:#d5dde1;background:#252d31;color:#fff;box-shadow:0 0 16px #d7e0e133}.dots{font:9px monospace;letter-spacing:4px;color:#758087}.gift{margin-top:4px;border:1px solid #58636a;padding:9px;background:#0d1112aa;box-shadow:inset 0 0 25px #d7e0e30a;font:9px monospace;letter-spacing:1px;color:#bfc8cc}.gift b{color:#dfe5e7}.final{margin-top:10px;padding-left:12px;border-left:2px solid #aeb9be;font:14px/1.5 "Space Mono",monospace;color:#e5e9ea;min-height:45px}@keyframes planetPulse{50%{transform:scale(1.015)}}@media(prefers-reduced-motion:reduce){.rocaterra-sphere{animation:none}}@media(orientation:portrait){main{display:none}.rotate{display:flex}}@media(orientation:landscape) and (max-height:900px){main{height:100dvh;min-height:100dvh}.panel{height:calc(100dvh - 12px);min-height:0;padding:12px 20px}.panel:before{display:none}.hero{min-height:0;height:calc(100dvh - 58px);grid-template-columns:30% 70%;overflow:hidden}.rocaterra-sphere{width:175px;height:175px}.data{position:absolute;left:3%;right:auto;top:7%;width:53%;height:82%;padding:12px 18px 36px;border-left:1px solid #495258;background:linear-gradient(90deg,#080b0e00,#080b0e66 18%,#080b0eaa);}padding:7px 12px 36px}.title{font-size:18px;letter-spacing:3px}.message{min-height:55px;align-items:flex-start;padding-top:4px}.message blockquote{font-size:13px;line-height:1.35;overflow-wrap:anywhere}.gift{margin-top:4px;padding:5px;font-size:7.5px}.final{font-size:13px;min-height:42px;margin-top:6px}.nav{margin-top:3px;bottom:3px;left:14px;right:14px}.button{padding:5px 7px;font-size:6.5px}.crater{transform:scale(.75)}}</style></head><body><div class="rotate"><div>GIRA TU TRADUCTOR NOMAI<small>ORIENTACIÓN HORIZONTAL REQUERIDA</small></div></div><main><section class="panel"><div class="top"><span class="meta">EXPLORER · 30 CICLOS DE EXPLORACIÓN</span><span class="meta identity">SEÑAL 02 · ROCATERRA</span></div>
<div class="screen active" id="s1"><div class="hero"><div class="planet"><div class="rocaterra-sphere"><div class="forest-crater"><span></span><i></i><b></b></div><i class="crater c1"></i><i class="crater c2"></i><i class="crater c3"></i><i class="crater c4"></i></div></div><div class="data"><div class="signal"><span class="decode-inline">DESCIFRANDO SEÑAL ···</span><span class="signal-real">TRANSMISIÓN NOMAI DETECTADA · <b>ESKER</b></span></div><h1 class="title">ROCATERRA</h1><div class="subtitle">REGISTRO DE EXPLORACIÓN</div><div class="message"><blockquote><span class="quote-text"></span></blockquote></div><div class="nav"><span class="dots">● ○</span><button class="button" onclick="go(2)">SIGUIENTE →</button></div></div></div></div>
<div class="screen" id="s2"><div class="hero"><div class="planet"><div class="rocaterra-sphere"><div class="forest-crater"><span></span><i></i><b></b></div><i class="crater c1"></i><i class="crater c2"></i><i class="crater c3"></i><i class="crater c4"></i></div></div><div class="data"><div class="signal"><span class="signal-real" style="display:inline">TRANSMISIÓN NOMAI · <b>ESKER</b></span></div><h1 class="title">SEÑAL EN CURSO</h1><div class="subtitle">REGISTRO · PROYECTO ACTUAL</div><div class="message"><blockquote><span class="quote-text"></span></blockquote></div><div class="nav"><button class="button" onclick="go(1)">← ANTERIOR</button><span class="dots">○ ●</span><button class="button" onclick="go(1)">VOLVER AL INICIO ↺</button></div></div></div></div></section></main><script>
let typing;
const lines={
  1:[['Hay curiosidades que no necesitan un objetivo claro, a veces solo hay que confiar en la señal.',false]],
  2:[['No parece que el explorador sepa exactamente qué estaba buscando.',false],['Eso nunca ha sido un problema.',false]]
};
function typeMsg(n){
  clearInterval(typing);
  const els=document.querySelectorAll('#s'+n+' .quote-text');
  const el=els[0];
  if(!el)return;
  el.innerHTML='';
  let li=0,ci=0;
  const arr=lines[n]||[];
  typing=setInterval(()=>{
    if(li>=arr.length){clearInterval(typing);return}
    if(!el.children[li]){
      const p=document.createElement('p');
      p.className=arr[li][1]?'bold-only':'';
      el.appendChild(p);
    }
    const p=el.children[li],text=arr[li][0];
    const prefix=((n===1||n===2)&&li===0)?'<b style="color:#fff">ESKER:</b> ':'';
    if(ci<text.length){p.innerHTML=prefix+text.slice(0,++ci)}
    else{li++;ci=0}
  },28);
}
function go(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s'+n).classList.add('active');
  typeMsg(n);
}
window.addEventListener('load',()=>setTimeout(()=>go(1),250));
window.addEventListener('orientationchange',()=>setTimeout(()=>{if(matchMedia('(orientation:landscape)').matches)go(1)},180));
</script></body></html>
