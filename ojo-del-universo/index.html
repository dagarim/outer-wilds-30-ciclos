<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ojo del Universo — 30 Ciclos de Exploración</title>
<style>
:root{
  --bg:#020207;
  --text:#d9d5e8;
  --muted:#77738a;
  --nomai:#9b8fc7;
  --quantum:#a86bdb;
  --quantum-soft:#6f4b91;
  --white:#f1eef8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden;overflow-y:auto;scroll-behavior:smooth}
#universe{
  min-height:100vh;
  min-height:100svh;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:clamp(30px,7vh,72px) 20px 48px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(78,47,101,.12),transparent 30%),
    radial-gradient(circle at 50% 50%,rgba(18,16,29,.5),transparent 62%),
    #020207;
}
.noise{position:absolute;inset:0;opacity:.18;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.35) .45px,transparent .45px);background-size:5px 5px;mix-blend-mode:screen}
.nomai-ring{position:absolute;width:min(72vw,620px);aspect-ratio:1;border:1px solid rgba(155,143,199,.13);border-radius:50%;opacity:.8}
.nomai-ring:before,.nomai-ring:after{content:"";position:absolute;inset:12%;border:1px solid rgba(155,143,199,.09);border-radius:50%;transform:rotate(31deg)}
.nomai-ring:after{inset:26%;border-radius:48% 52% 47% 53%;transform:rotate(-22deg)}
.eye-mark{position:absolute;width:112px;height:112px;border:1px solid rgba(168,107,219,.15);border-radius:50%;display:grid;place-items:center;opacity:.5}
.eye-mark:before{content:"";width:42px;height:42px;border:1px solid rgba(168,107,219,.27);border-radius:50%}
.eye-mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(168,107,219,.42);box-shadow:0 0 24px rgba(168,107,219,.5)}

.quantum-moon{
  position:absolute;
  left:84%;
  top:48%;
  width:clamp(58px,13vw,92px);
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.72);
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#c8c8c5 0%,#aaa9a6 42%,#85847f 72%,#6b6a66 100%);
  box-shadow:0 0 22px rgba(190,190,185,.18),inset -10px -12px 18px rgba(30,30,30,.2);
  opacity:0;
  z-index:3;
  pointer-events:none;
  animation:quantumMoon 17s ease-in-out 24s infinite;
}
@keyframes quantumMoon{
  0%,38%,100%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
  43%{opacity:.12;transform:translate(-50%,-50%) scale(.78)}
  47%{opacity:.92;transform:translate(-50%,-50%) scale(1)}
  51%{opacity:.96;transform:translate(-50%,-50%) scale(1.02)}
  55%{opacity:.28;transform:translate(-50%,-50%) scale(.96)}
  58%{opacity:0;transform:translate(-50%,-50%) scale(.82)}
}
.stones{position:absolute;inset:0;pointer-events:none}
.quantum-moon{
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(82px,17vw,118px);
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.72);
  border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#b8b7b9 0%,#9e9da0 42%,#7f7e82 78%,#69686c 100%);
  box-shadow:0 0 22px rgba(180,178,190,.12), inset -10px -12px 18px rgba(35,34,40,.22), inset 8px 7px 14px rgba(235,234,236,.08);
  opacity:0;
  z-index:3;
  animation:quantumMoon 18s ease-in-out 30s infinite;
}
.quantum-moon:before,.quantum-moon:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(60,59,64,.13);
}
.quantum-moon:before{width:15%;height:11%;left:27%;top:39%}
.quantum-moon:after{width:10%;height:8%;left:61%;top:24%}
@keyframes quantumMoon{
  0%,31%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
  34%{opacity:.08;transform:translate(-50%,-50%) scale(.78)}
  37%{opacity:.72;transform:translate(-50%,-50%) scale(.94)}
  40%{opacity:.9;transform:translate(-50%,-50%) scale(1)}
  44%{opacity:.72;transform:translate(-50%,-50%) scale(1.01)}
  47%{opacity:.12;transform:translate(-50%,-50%) scale(.96)}
  49%,100%{opacity:0;transform:translate(-50%,-50%) scale(.78)}
}
.stone{position:absolute;width:9px;height:15px;border-radius:45% 55% 48% 52%;background:linear-gradient(145deg,#c49be7,#70438e);box-shadow:0 0 15px rgba(168,107,219,.38);opacity:0;animation:quantum 7s infinite ease-in-out}
.s1{left:14%;top:23%;animation-delay:0s}.s2{left:82%;top:29%;animation-delay:2.1s}.s3{left:24%;top:72%;animation-delay:4s}.s4{left:75%;top:76%;animation-delay:1.3s}.s5{left:61%;top:16%;animation-delay:5s}.s6{left:39%;top:83%;animation-delay:3.1s}.s7{left:91%;top:56%;animation-delay:4.8s}.s8{left:8%;top:51%;animation-delay:1s}
@keyframes quantum{
  0%,12%,100%{opacity:0;transform:translate(0,0) rotate(0) scale(.7)}
  25%,45%{opacity:.72}
  55%{opacity:.05;transform:translate(18px,-12px) rotate(70deg) scale(1.2)}
  70%{opacity:.65;transform:translate(-11px,9px) rotate(-45deg) scale(.85)}
  82%{opacity:0}
}
.panel{
  width:min(720px,100%);
  position:relative;
  z-index:2;
  text-align:center;
  padding:20px 4px;
}
.quantum-symbol{
  display:inline-block;
  width:15px;
  height:20px;
  margin:0 9px 0 1px;
  vertical-align:-6px;
  overflow:visible;
  opacity:.72;
  filter:drop-shadow(0 0 5px rgba(168,107,219,.2));
  animation:quantumSymbol 5s ease-in-out infinite;
}
.quantum-symbol path{
  fill:none;
  stroke:rgba(168,107,219,.78);
  stroke-width:1.15;
  stroke-linejoin:round;
}
.quantum-symbol path+path{
  stroke:rgba(168,107,219,.42);
  stroke-width:.85;
}
@keyframes quantumSymbol{
  0%,100%{opacity:.5;box-shadow:0 0 6px rgba(168,107,219,.16)}
  50%{opacity:.9;box-shadow:0 0 12px rgba(168,107,219,.34)}
}
.signal{
  font:11px/1.6 "Courier New",monospace;
  letter-spacing:.28em;
  margin-top:12px;
  color:#746d82;
  margin-bottom:34px;
  text-transform:uppercase;
}
.intro-line{
  display:block;
  opacity:0;
  animation:slowReveal 2.8s ease-out forwards;
}
.intro-line:nth-child(1){animation-delay:.8s}
.intro-line:nth-child(2){animation-delay:2.2s}
.intro-word{
  display:inline-block;
  opacity:0;
  transform:translateY(4px);
  animation:wordReveal 1.8s ease-out forwards;
}
.intro-word:nth-child(1){animation-delay:.9s}
.intro-word:nth-child(2){animation-delay:1.45s}
.intro-word:nth-child(3){animation-delay:2s}
.intro-word:nth-child(4){animation-delay:2.55s}
.intro-word:nth-child(5){animation-delay:3.1s}
@keyframes slowReveal{
  from{opacity:0}
  to{opacity:1}
}
@keyframes wordReveal{
  0%{opacity:0;transform:translateY(5px);filter:blur(2px)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
.signal span{display:block}.intro-title{opacity:0;animation:introTitle 4s ease-out 5.9s forwards}
@keyframes introTitle{from{opacity:0;transform:translateY(8px);letter-spacing:.28em}to{opacity:1;transform:none;letter-spacing:.16em}}
.signal .eye{color:#b18bd0}
.solanum{
  font:11px/1.6 "Courier New",monospace;
  letter-spacing:.35em;
  color:var(--nomai);
  text-transform:uppercase;
  margin-bottom:8px;
}
h1{
  margin:0 0 34px;
  font-size:clamp(25px,6vw,43px);
  font-weight:400;
  letter-spacing:.16em;
  color:#e5e0ee;
  text-shadow:0 0 22px rgba(155,143,199,.14);
}
.message{
  min-height:2.2em;
  margin:0 auto;
  max-width:640px;
  font-size:clamp(17px,3.8vw,22px);
  line-height:1.8;
  color:#c7c1d3;
}
.message p{margin:0 0 20px}
#messages{opacity:0;transition:opacity 1.4s ease}
#messages.ready{opacity:1}
.keyword{color:#c48be8;letter-spacing:.1em;text-shadow:0 0 7px rgba(168,107,219,.55),0 0 16px rgba(168,107,219,.3)}
.speaker-line{font-size:18px;letter-spacing:.18em;font-weight:700;color:#d29aff;text-shadow:0 0 5px #d29aff,0 0 12px rgba(168,107,219,.95),0 0 28px rgba(168,107,219,.75),0 0 45px rgba(168,107,219,.42)}
.rule{width:100px;height:1px;background:linear-gradient(90deg,transparent,rgba(155,143,199,.45),transparent);margin:30px auto}
.final{
  margin-top:20px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity 1.5s ease,transform 1.5s ease;
}
.final.show{opacity:1;transform:none}
.last{
  margin-top:28px;
  font-family:"Courier New",monospace;
  font-size:clamp(12px,2.6vw,15px);
  letter-spacing:.18em;
  line-height:2;
  color:#8e889b;
}
.unknown{color:#b6a9c9}
.thirty{
  margin-top:42px;
  font:10px/1.8 "Courier New",monospace;
  letter-spacing:.34em;
  color:#5e5969;
  text-transform:uppercase;
}
#start{display:none}
@media(max-width:600px){
  #universe{padding:24px 18px 70px;min-height:100svh;overflow:visible}
  .nomai-ring{width:110vw}
  .eye-mark{width:82px;height:82px}
  .quantum-moon{left:90%;top:42%;}
  .speaker-line{
  margin:0 0 24px;
  font:700 18px/1.6 "Courier New",monospace;
  letter-spacing:.18em;
  text-align:left;
  color:#d29aff;
  text-shadow:0 0 5px #d29aff,0 0 12px rgba(168,107,219,.95),0 0 28px rgba(168,107,219,.75),0 0 45px rgba(168,107,219,.42);
}
.message{line-height:1.7}
}
@media(prefers-reduced-motion:reduce){
  .stone{animation:none;opacity:.18}
  .final{transition:none}
}
</style>
</head>
<body>
<main id="universe">
  <div class="noise"></div>
  <div class="nomai-ring"></div>
  <div class="eye-mark" aria-hidden="true"></div>
  <div class="quantum-moon" aria-hidden="true"></div>
  <div class="stones" aria-hidden="true">
    <i class="stone s1"></i><i class="stone s2"></i><i class="stone s3"></i><i class="stone s4"></i>
    <i class="stone s5"></i><i class="stone s6"></i><i class="stone s7"></i><i class="stone s8"></i>
  </div>

  <section class="panel" aria-live="polite">
    <div class="signal">
  <span class="intro-line">
    <svg class="quantum-symbol" aria-hidden="true" viewBox="0 0 24 30"><path d="M12 2 L19 7 L21 16 L15 27 L7 24 L3 15 L5 7 Z"></path><path d="M9 8 L15 6 L18 12 L14 19 L8 17 L6 12 Z"></path></svg><span class="intro-word">UBICACIÓN</span>
    <span class="intro-word">CUÁNTICA</span>
    <span class="intro-word">DETECTADA</span>
  </span>
  <span class="eye intro-line">SEÑAL DEL OJO ···</span>
</div>
    <div id="messages" class="message"></div>

    <div id="final" class="final">
      <div class="rule"></div>
      <div class="signal"><span class="eye">ÚLTIMO REGISTRO</span></div>
      <div id="lastMessages" class="message"></div>
      <div class="last">
        SEÑAL DEL OJO DETECTADA<br>
        <span class="unknown">[JORGE ÚBEDA ROMERO] — 30</span><br>
        NO HAY MÁS SEÑALES DETECTADAS.<br><br>
        «O quizá todavía no sabemos descifrarlas.»<br>
        <span class="unknown">IDIOMA DESCONOCIDO</span>
      </div>
      <div class="thirty">30 CICLOS DE EXPLORACIÓN</div>
    </div>
  </section>
</main>

<script>
(function(){
  const first=[
    "«Y quizá eso sea lo extraño de las señales.»",
    "«Nunca sabemos cuánto tiempo permanecerán con nosotros.»",
    "«Algunas vienen de muy lejos; otras, de quienes ya no están; otras todavía no han llegado.»",
    "«Pero mientras podamos escucharlas, nunca estarán completamente perdidas.»",
    "SEÑAL ESTABLECIDA.",
    "CONEXIÓN CON EL OJO: DETECTADA."
  ];
  const last=[
    "«Quizá un universo no sea más que la suma de todas sus señales.»",
    "«Has llegado hasta aquí siguiendo las huellas de otros y creando nuevas.»",
    "«La señal continúa.»",
    "«Pero su destino todavía no ha sido determinado.»",
    "«Felices 30.»"
  ];
  const box=document.getElementById("messages");
  const final=document.getElementById("final");
  const lastBox=document.getElementById("lastMessages");
  const speed=52;
  const pause=900;

  function teleprompter(el){
    const target=el.getBoundingClientRect();
    const ideal=window.innerHeight*0.56;
    const delta=target.top-ideal;
    if(Math.abs(delta)>34){
      window.scrollBy({top:delta,behavior:"smooth"});
    }
  }

  function revealAndScroll(el){
    el.classList.add("show");
    requestAnimationFrame(function(){
      setTimeout(function(){teleprompter(el);},80);
    });
  }

  function typeSpeaker(target,done){
    const p=document.createElement("div");
    p.className="speaker-line keyword";
    target.appendChild(p);
    const text="SOLANUM:";
    let i=0;
    function type(){
      i++;
      p.textContent=text.slice(0,i);
      if(i<text.length) setTimeout(type,70);
      else setTimeout(function(){teleprompter(p); done&&done();},220);
    }
    type();
  }

  function typeLines(lines,target,done){
    let line=0;
    function next(){
      if(line>=lines.length){done&&done();return}
      const p=document.createElement("p");
      target.appendChild(p);
      const text=lines[line++];
      if(line>4) p.classList.add("keyword");
      let i=0;
      function type(){
        i++;
        p.textContent=text.slice(0,i);
        if(i<text.length) setTimeout(type,speed);
        else {
          teleprompter(p);
          setTimeout(next,pause);
        }
      }
      type();
    }
    next();
  }

  setTimeout(function(){
    box.classList.add("ready");
    typeSpeaker(box,function(){
      typeLines(first,box,function(){
      revealAndScroll(final);
      typeLines(last,lastBox,function(){
        setTimeout(function(){
          teleprompter(final.querySelector(".last"));
          setTimeout(function(){
            teleprompter(final.querySelector(".thirty"));
          },700);
        },120);
      });
    });
      });
  },8800);
})();
</script>
</body>
</html>
